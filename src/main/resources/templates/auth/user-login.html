<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - DigiLib FPJ</title>
    <link rel="stylesheet" th:href="@{/css/modern-ui.css}">
</head>
<body>
<nav class="navbar">
    <div><strong>DigiLib FPJ</strong></div>
    <div class="nav-links">
        <a class="nav-link" th:href="@{/}">Home</a>
        <a class="nav-link" th:href="@{/login/admin}">Admin</a>
    </div>
    <button class="theme-toggle" type="button">Switch to Dark</button>
</nav>
<main class="center-stage">
    <section class="login-card">
        <h1 class="login-title">Welcome Back</h1>
        <p class="login-subtitle">Log in to browse books and complete purchases.</p>
        <form th:action="@{/login}" method="post" class="form-grid">
            <input class="text-input" type="text" id="username" name="username" placeholder="Username" required>
            <input class="text-input" type="password" id="password" name="password" placeholder="Password" required>
            <button class="primary-button" type="submit">Sign In</button>
        </form>
    </section>
</main>
<script th:src="@{/js/theme-toggle.js}"></script>
</body>
</html>
